<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login - Daily BRIEF</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        :root {
          --color-primary: #4F46E5;
          --color-on-primary: #ffffff;
          --color-background: #F8FAFC;
          --color-on-surface: #0F172A;
          --color-secondary: #64748B;
          --color-surface-container-lowest: #ffffff;
          --color-surface-container-low: #F1F5F9;
          --color-surface-container: #E2E8F0;
          --color-surface-container-high: #CBD5E1;
          --color-surface-container-highest: #94A3B8;
          --color-surface-bright: #ffffff;
          --color-outline-variant: #E2E8F0;
          --color-error: #EF4444;
        }
        .dark {
          --color-primary: #818CF8;
          --color-on-primary: #0F172A;
          --color-background: #0B0F19;
          --color-on-surface: #F8FAFC;
          --color-secondary: #94A3B8;
          --color-surface-container-lowest: #0F172A;
          --color-surface-container-low: #1E293B;
          --color-surface-container: #334155;
          --color-surface-container-high: #475569;
          --color-surface-container-highest: #64748B;
          --color-surface-bright: #0F172A;
          --color-outline-variant: #1E293B;
          --color-error: #F87171;
        }
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "var(--color-primary)",
              "on-primary": "var(--color-on-primary)",
              "background": "var(--color-background)",
              "on-surface": "var(--color-on-surface)",
              "secondary": "var(--color-secondary)",
              "surface-container-lowest": "var(--color-surface-container-lowest)",
              "surface-container-low": "var(--color-surface-container-low)",
              "surface-container": "var(--color-surface-container)",
              "surface-container-high": "var(--color-surface-container-high)",
              "surface-container-highest": "var(--color-surface-container-highest)",
              "surface-bright": "var(--color-surface-bright)",
              "outline-variant": "var(--color-outline-variant)",
              "error": "var(--color-error)"
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center px-4">
    <!-- Dark Mode Toggle -->
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleDarkMode()" class="text-secondary hover:text-primary transition-colors p-2 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center cursor-pointer">
            <span class="material-symbols-outlined">dark_mode</span>
        </button>
    </div>
    
    <div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-sm transition-all hover:shadow-md">
        
        <!-- Header -->
        <header class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container mb-2 text-primary">
                <span class="material-symbols-outlined text-[28px]">calendar_today</span>
            </div>
            <h1 class="text-2xl font-bold text-on-surface">Welcome back</h1>
            <p class="text-sm text-secondary mt-1" id="auth-subtitle">
                Minimalist task logger & export engine
            </p>
        </header>

        <!-- Error Alert -->
        <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg"></div>

        <!-- Auth Form -->
        <form id="login-form" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-secondary uppercase tracking-wider">
                    Username or Email Address
                </label>
                <input
                    id="email-input" autocomplete="off"
                    type="text"
                    required
                    class="w-full h-12 px-4 bg-background border border-outline-variant rounded-lg text-sm text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-secondary/40"
                    placeholder="admin or user@domain.com"
                />
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-secondary uppercase tracking-wider">
                        Password
                    </label>
                    <span id="pwd-info" class="text-[11px] text-primary/70 font-medium">Optional locally</span>
                </div>
                <div class="relative w-full">
                    <input
                        id="password-input" autocomplete="new-password"
                        type="password"
                        class="w-full h-12 px-4 pr-12 bg-background border border-outline-variant rounded-lg text-sm text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-secondary/40"
                        placeholder="••••••••"
                    />
                    <button type="button" id="toggle-password" aria-label="Show password" class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-primary p-1 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/20 transition-colors flex items-center justify-center">
                        <span class="material-symbols-outlined text-[20px]" id="toggle-password-icon">visibility</span>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                id="submit-btn"
                class="mt-4 w-full h-12 bg-primary text-on-primary font-semibold rounded-lg flex items-center justify-center gap-2 cursor-pointer hover:bg-primary/95 active:scale-[0.98] transition-all shadow-lg shadow-[#1e35d0]/10"
            >
                <span class="material-symbols-outlined text-[20px]">login</span>
                Sign In
            </button>
        </form>

        <!-- Local Dev Badge -->
        <footer class="mt-6 pt-4 text-center" id="auth-footer">
        </footer>
    </div>

    <script>
        // Check configuration status and populate helper text
        async function checkConfig() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.user) {
                        // Already logged in
                        window.location.href = '/dashboard';
                        return;
                    }
                    
                    if (data.is_supabase) {
                        document.getElementById('auth-subtitle').textContent = "Access your daily operations tracker";
                        document.getElementById('pwd-info').textContent = "Required";
                        document.getElementById('auth-footer').innerHTML = `
                            <p class="text-[11px] text-secondary">
                                Secured by Supabase Authentication.
                            </p>
                        `;
                    }
                }
            } catch (err) {
                console.error("Config check failed", err);
            }
        }
        
        checkConfig();

        // Handle Login Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorAlert = document.getElementById('error-alert');
            const submitBtn = document.getElementById('submit-btn');
            
            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">sync</span> Processing...`;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorAlert.textContent = data.detail || data.error || "Authentication failed.";
                    errorAlert.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">login</span> Sign In`;
                }
            } catch (err) {
                errorAlert.textContent = "Network error. Failed to connect to server.";
                errorAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">login</span> Sign In`;
            }
        });

        // Handle Password Visibility Toggle
        document.getElementById('toggle-password')?.addEventListener('click', () => {
            const pwdInput = document.getElementById('password-input');
            const pwdIcon = document.getElementById('toggle-password-icon');
            const btn = document.getElementById('toggle-password');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.textContent = 'visibility_off';
                btn.setAttribute('aria-label', 'Hide password');
            } else {
                pwdInput.type = 'password';
                pwdIcon.textContent = 'visibility';
                btn.setAttribute('aria-label', 'Show password');
            }
        });
    </script>
</body>
</html>
