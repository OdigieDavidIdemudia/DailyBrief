<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Change Password - Daily BRIEF</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        :root {
          --color-primary: #4F46E5;
          --color-on-primary: #ffffff;
          --color-background: #F8FAFC;
          --color-on-surface: #0F172A;
          --color-secondary: #64748B;
          --color-surface-container-lowest: #ffffff;
          --color-surface-container-low: #F1F5F9;
          --color-surface-container: #E2E8F0;
          --color-surface-container-high: #CBD5E1;
          --color-surface-container-highest: #94A3B8;
          --color-surface-bright: #ffffff;
          --color-outline-variant: #E2E8F0;
          --color-error: #EF4444;
        }
        .dark {
          --color-primary: #818CF8;
          --color-on-primary: #0F172A;
          --color-background: #0B0F19;
          --color-on-surface: #F8FAFC;
          --color-secondary: #94A3B8;
          --color-surface-container-lowest: #0F172A;
          --color-surface-container-low: #1E293B;
          --color-surface-container: #334155;
          --color-surface-container-high: #475569;
          --color-surface-container-highest: #64748B;
          --color-surface-bright: #0F172A;
          --color-outline-variant: #1E293B;
          --color-error: #F87171;
        }
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script>
async function handleChangePassword(e) {
    e.preventDefault();
    const new_password = document.getElementById('new_password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const errorEl = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');
    
    if (new_password !== confirm_password) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.classList.remove('hidden');
        return;
    }
    
    errorEl.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Updating...</span>';
    
    try {
        const res = await fetch('/api/auth/change_password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ new_password: new_password })
        });
        
        const data = await res.json();
        if (res.ok && data.success) {
            window.location.href = '/dashboard';
        } else {
            throw new Error(data.detail || data.error || 'Failed to update password');
        }
    } catch(err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Update Password</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
    }
}
</script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "var(--color-primary)",
              "on-primary": "var(--color-on-primary)",
              "background": "var(--color-background)",
              "on-surface": "var(--color-on-surface)",
              "secondary": "var(--color-secondary)",
              "surface-container-lowest": "var(--color-surface-container-lowest)",
              "surface-container-low": "var(--color-surface-container-low)",
              "surface-container": "var(--color-surface-container)",
              "surface-container-high": "var(--color-surface-container-high)",
              "surface-container-highest": "var(--color-surface-container-highest)",
              "surface-bright": "var(--color-surface-bright)",
              "outline-variant": "var(--color-outline-variant)",
              "error": "var(--color-error)"
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center px-4">
    <!-- Dark Mode Toggle -->
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleDarkMode()" class="text-secondary hover:text-primary transition-colors p-2 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center cursor-pointer">
            <span class="material-symbols-outlined">dark_mode</span>
        </button>
    </div>
    
    <div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-sm transition-all hover:shadow-md">
        
        <!-- Header -->
        <header class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container mb-2 text-primary">
                <span class="material-symbols-outlined text-[28px]">calendar_today</span>
            </div>
            <h1 class="text-2xl font-bold text-on-surface">Welcome back</h1>
            <p class="text-sm text-secondary mt-1" id="auth-subtitle">
                Minimalist task logger & export engine
            </p>
        </header>

        <!-- Error Alert -->
        <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg"></div>

        <!-- Auth Form -->
        <form id="change-password-form" class="space-y-4" onsubmit="handleChangePassword(event)">
    <div class="space-y-1.5">
        <label for="new_password" class="block text-sm font-medium text-on-surface">New Password</label>
        <input type="password" id="new_password" required
            class="w-full h-11 px-4 bg-surface-bright border border-outline-variant rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-on-surface" 
            placeholder="Enter new password">
    </div>
    <div class="space-y-1.5">
        <label for="confirm_password" class="block text-sm font-medium text-on-surface">Confirm Password</label>
        <input type="password" id="confirm_password" required
            class="w-full h-11 px-4 bg-surface-bright border border-outline-variant rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-on-surface" 
            placeholder="Confirm new password">
    </div>
    <div id="error-message" class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-sm border border-red-100"></div>
    <button type="submit" id="submit-btn" 
        class="w-full h-11 rounded-lg font-bold bg-primary text-on-primary hover:bg-primary/90 hover:shadow-md transition-all flex items-center justify-center gap-2">
        <span>Update Password</span>
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
    </button>
</form>

        <!-- Local Dev Badge -->
        <footer class="mt-6 pt-4 text-center" id="auth-footer">
        </footer>
    </div>

    <script>
        // Check configuration status and populate helper text
        async function checkConfig() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.user) {
                        // Already logged in
                        window.location.href = '/dashboard';
                        return;
                    }
                    
                    if (data.is_supabase) {
                        document.getElementById('auth-subtitle').textContent = "Access your daily operations tracker";
                        document.getElementById('pwd-info').textContent = "Required";
                        document.getElementById('auth-footer').innerHTML = `
                            <p class="text-[11px] text-secondary">
                                Secured by Supabase Authentication.
                            </p>
                        `;
                    }
                }
            } catch (err) {
                console.error("Config check failed", err);
            }
        }
        
        checkConfig();

        // Handle Login Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorAlert = document.getElementById('error-alert');
            const submitBtn = document.getElementById('submit-btn');
            
            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">sync</span> Processing...`;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorAlert.textContent = data.detail || data.error || "Authentication failed.";
                    errorAlert.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">login</span> Sign In`;
                }
            } catch (err) {
                errorAlert.textContent = "Network error. Failed to connect to server.";
                errorAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">login</span> Sign In`;
            }
        });

        // Handle Password Visibility Toggle
        document.getElementById('toggle-password')?.addEventListener('click', () => {
            const pwdInput = document.getElementById('password-input');
            const pwdIcon = document.getElementById('toggle-password-icon');
            const btn = document.getElementById('toggle-password');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.textContent = 'visibility_off';
                btn.setAttribute('aria-label', 'Hide password');
            } else {
                pwdInput.type = 'password';
                pwdIcon.textContent = 'visibility';
                btn.setAttribute('aria-label', 'Show password');
            }
        });
    </script>
</body>
</html>
